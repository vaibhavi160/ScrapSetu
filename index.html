    <script>
      (function() {
        // Intercept Vite HMR WebSocket connection attempts in sandboxed container
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          function ViteNoopWS(url, protocols) {
            this.url = String(url);
            this.protocol = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            this.readyState = 1; // OPEN
            this.OPEN = 1;
            this.CLOSED = 3;
            this.CLOSING = 2;
            this.CONNECTING = 0;
            this._listeners = {};
            var self = this;
            setTimeout(function() {
              if (self.onopen) {
                try { self.onopen(new Event('open')); } catch (e) {}
              }
              var list = self._listeners['open'] || [];
              list.forEach(function(fn) {
                try { fn(new Event('open')); } catch (e) {}
              });
            }, 0);
          }
          ViteNoopWS.prototype.addEventListener = function(event, handler) {
            if (!this._listeners[event]) this._listeners[event] = [];
            this._listeners[event].push(handler);
          };
          ViteNoopWS.prototype.removeEventListener = function(event, handler) {
            if (!this._listeners[event]) return;
            this._listeners[event] = this._listeners[event].filter(function(h) { return h !== handler; });
          };
          ViteNoopWS.prototype.send = function() {};
          ViteNoopWS.prototype.close = function() {
            this.readyState = 3;
            var list = this._listeners['close'] || [];
            list.forEach(function(fn) {
              try { fn(new Event('close')); } catch (e) {}
            });
          };

          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            if (protoStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1 || urlStr.indexOf('vite') !== -1) {
              return new ViteNoopWS(url, protocols);
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress [vite] console messages
        var methods = ['log', 'warn', 'error', 'info', 'debug'];
        methods.forEach(function(m) {
          var orig = console[m];
          console[m] = function() {
            for (var i = 0; i < arguments.length; i++) {
              var str = String(arguments[i] || '');
              if (str.indexOf('[vite]') !== -1 || str.indexOf('failed to connect to websocket') !== -1) {
                return;
              }
            }
            return orig.apply(console, arguments);
          };
        });

        // Suppress unhandled promise rejections related to [vite]
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason ? String(event.reason) : '';
          if (reason.indexOf('[vite]') !== -1 || reason.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event && event.message ? String(event.message) : '';
          if (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
